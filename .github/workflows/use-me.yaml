name: I am Reusable Workflow

on:
    workflow_call:
        inputs:
            name:
                required: true
                type: string
jobs:
    greeting:
        environment:
            name: production
        runs-on: ubuntu-latest
        steps:
            - name: Greeting
              run: |
                echo Hello ${{ inputs.name }} Good evening!!
                echo Welcome to Chai Point!!!